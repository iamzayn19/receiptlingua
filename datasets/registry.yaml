# Dataset registry (milestone 171-185 Datasets/benchmarking).
#
# Every dataset entry used for benchmarking or evaluation MUST be listed
# here, BEFORE use, with its license, redistribution permission, citation,
# checksum, languages, sample count, and annotation types. This is a
# project non-negotiable: no scraping receipt photos from the internet /
# social media, and no undocumented dataset ever touches the benchmark
# pipeline.
#
# Status as of this pass (2026-09-27): 100% of the benchmark data actually
# used is synthetic, generated by this repo's own code
# (python/src/receiptlingua/synth/) with exact, generator-known ground
# truth. No external dataset has been downloaded, redistributed, or run
# through the pipeline in this pass. The "synthetic" entry below is the
# only *active* entry; the "candidate" entries are documented but
# deliberately NOT integrated yet, pending real license verification.

datasets:
  - id: synthetic-v1
    status: active
    kind: synthetic
    description: >
      Deterministically generated fictional receipts (non-impersonating
      businesses), rendered with real system fonts, with exact
      programmatically-known ground truth (merchant, date, time, line
      items, subtotal, tax, total, full text). Generated by
      python/src/receiptlingua/synth/generator.py; degraded by
      python/src/receiptlingua/synth/degrade.py.
    license: "N/A - originated by this project, no third-party content"
    redistribution_permitted: true
    citation: null
    checksum: null  # generated on demand from a seed; not a fixed static file to checksum
    languages: [en, ta, ar]  # hi, he have real fonts too but are not yet exercised by run_benchmark.py defaults
    sample_count: variable  # see benchmarks/latest_summary.json for the actual count of the last real run
    annotation_types:
      - full_text
      - merchant
      - address
      - date
      - time
      - line_items (description, quantity, unit_price, item_total)
      - subtotal
      - tax
      - total
      - currency
    notes: >
      Ground truth is exact by construction (the generator wrote the
      text, so it knows the text) -- no manual annotation step, no
      annotation error to account for. Determinism verified by
      python/tests/test_synth_generator.py (same seed -> byte-identical
      image + identical ground truth JSON).

  # --- Candidate external datasets: documented, NOT integrated ---
  # Neither of these was downloaded or used in this pass. Re-verify the
  # license/ToS text at the current source URL (not just this note) before
  # ever flipping status to "active", and fill in a real checksum of the
  # actual downloaded archive at that time.

  - id: cord-v1
    status: candidate-not-integrated
    kind: external
    description: >
      CORD (Consolidated Receipt Dataset for post-OCR parsing) --
      Indonesian receipts with OCR + structured field annotations
      (menu items, subtotal, tax, total). Commonly cited in OCR/IE
      literature.
    license: "Reported as CC BY 4.0 by upstream distributions at time of
      writing -- NOT independently re-verified in this pass. Must be
      re-checked against the current official release page before use;
      do not trust this note as a substitute for that check."
    redistribution_permitted: unverified
    citation: >
      Park et al., "CORD: A Consolidated Receipt Dataset for Post-OCR
      Parsing", Document Intelligence Workshop @ NeurIPS 2019.
    checksum: null  # not downloaded
    languages: [id]  # Indonesian; would extend, not replace, the synthetic en/ta/ar set
    sample_count: null  # not downloaded; upstream reports ~1000 images across train/dev/test splits
    annotation_types: [ocr_text, structured_fields, bounding_boxes]
    why_not_integrated_this_pass: >
      License re-verification and download/extraction were judged too
      slow/uncertain to fit this pass's time budget without risking the
      synthetic-benchmark deliverable. Explicitly deferred, not silently
      dropped.
    next_step: >
      Re-verify current license terms and redistribution permission at
      the dataset's current official source, record a real checksum of
      the downloaded archive, fill in the real sample_count and any
      annotation caveats, flip status to "active", and add an `id`
      language entry to the language matrix's receipt_verified evidence
      once real benchmark numbers exist for it.

  - id: sroie-2019
    status: candidate-not-integrated
    kind: external
    description: >
      SROIE (Scanned Receipts OCR and Information Extraction), ICDAR 2019
      robust reading competition dataset -- English receipts with text
      detection, recognition, and key information extraction (company,
      date, address, total) annotations.
    license: "Distributed for the ICDAR 2019 SROIE competition; typically
      requires agreeing to the competition's terms of use / research-only
      restriction. NOT independently re-verified in this pass."
    redistribution_permitted: unverified
    citation: >
      Huang et al., "ICDAR2019 Competition on Scanned Receipt OCR and
      Information Extraction", ICDAR 2019.
    checksum: null
    languages: [en]
    sample_count: null  # upstream reports 1000 receipts across train/test
    annotation_types: [ocr_text, bounding_boxes, key_value_fields]
    why_not_integrated_this_pass: >
      Same reasoning as cord-v1: license/ToS re-verification and dataset
      acquisition were out of scope for this pass's time budget.
    next_step: >
      Same as cord-v1 -- re-verify terms at the current official source
      (competition site / mirror), record checksum, sample_count, and
      confirm the terms actually permit the specific use (redistribution
      vs. research-only evaluation are different permissions) before
      flipping status to "active".

schema_version: 1
