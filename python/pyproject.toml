[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receiptlingua"
version = "0.1.0.dev0"
description = "Offline-first, multilingual receipt OCR (Python ML implementation)"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "ReceiptLingua contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "opencv-python-headless>=4.9",
  "pytesseract>=0.3.10",
  "regex>=2024.1.1",
  "py3langid>=0.4.0",
  "arabic-reshaper>=3.0.0",
  "python-bidi>=0.6.0",
]

[project.optional-dependencies]
paddleocr = [
  # Not currently installable on Python 3.14 -- see
  # docs/adr/0002-ocr-backend-selection.md. Listed so the extra is ready
  # once an upstream build supports this interpreter, or so it can be
  # installed into a separate pinned-Python sidecar venv.
  "paddlepaddle>=2.6",
  "paddleocr>=2.7",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "jsonschema>=4.20",
]

[project.scripts]
receiptlingua = "receiptlingua.cli:main"

[project.urls]
Homepage = "https://github.com/iamzayn19/receiptlingua"
Repository = "https://github.com/iamzayn19/receiptlingua"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# language_matrix.json (loaded at runtime by receiptlingua.langid.matrix)
# is data, not code -- setuptools does not include it in the built
# wheel/sdist by default, which broke `receiptlingua languages` on a real
# `pip install` (worked only in editable/dev mode by sys.path accident).
receiptlingua = ["langid/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
