[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receiptlingua"
version = "0.1.0"
description = "Offline-first, multilingual receipt OCR (Python ML implementation)"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "ReceiptLingua contributors" }]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
