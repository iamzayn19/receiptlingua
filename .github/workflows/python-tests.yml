name: Python tests

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python-tests.yml"

# Fast CI only. This workflow deliberately installs the lightweight,
# CPU-only dependency set (numpy/pillow/opencv-headless/pytesseract/
# regex/py3langid/arabic-reshaper/python-bidi) declared in
# python/pyproject.toml's [project.dependencies] and [project.optional-
# dependencies].dev -- it never installs the `paddleocr` extra
# (paddlepaddle/paddleocr), which is multi-gigabyte and, per
# docs/adr/0002-ocr-backend-selection.md, isn't even installable on
# every supported Python version. PaddleOCR-sidecar tests
# (test_paddleocr_engine.py) skip themselves cleanly via
# RECEIPTLINGUA_PADDLE_PYTHON not being set -- same behavior as a local
# dev machine without the sidecar configured. Non-English Tesseract
# language-pack tests (test_langid_e2e_tesseract.py) skip themselves the
# same way when tam/ara traineddata isn't installed. The heavy,
# multi-thousand-case benchmark suite lives entirely in benchmark.yml,
# not here.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: python/pyproject.toml

      - name: Install Tesseract (English only, matches lightweight fast-CI scope)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install Tesseract (English only, matches lightweight fast-CI scope)
        if: runner.os == 'macOS'
        run: brew install tesseract

      - name: Install package with dev extras
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: pytest
        run: pytest -q
