name: Security scans

# Dependency vulnerability scanning + secret scanning. Runs on every push/PR
# (all of these are fast: no OCR models, no benchmark data) plus weekly on a
# schedule so newly-disclosed CVEs against pinned dependencies are caught
# even when nothing in the repo changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python/pyproject.toml
      - run: python -m pip install --upgrade pip pip-audit
      - name: Install project (lightweight deps only, no paddleocr extra)
        run: pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit --strict

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: javascript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: javascript/package-lock.json
      - run: npm ci
      - name: npm audit (production + dev dependencies)
        run: npm audit --audit-level=high

  bundler-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruby
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ruby
      - run: gem install bundler-audit
      - name: bundler-audit
        run: bundler-audit check --update

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
