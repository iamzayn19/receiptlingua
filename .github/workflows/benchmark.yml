name: Benchmark suite

# Deliberately NOT run on every push/PR. The benchmark suite generates and
# OCRs hundreds of synthetic multilingual receipts (see BENCHMARKS.md /
# benchmarks/run_benchmark.py) -- it is minutes of CPU-bound OCR work per
# run, not the sub-minute "does it import and pass unit tests" check the
# other workflows do. This is the explicit split between fast CI (every
# PR) and heavyweight OCR benchmark CI (on demand / scheduled) that the
# project's CI plan calls for.
on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Comma-separated language codes to benchmark"
        required: false
        default: "en,ta,ar,hi,he"
      samples_per_language:
        description: "Samples per language per degradation"
        required: false
        default: "5"
  schedule:
    - cron: "0 5 * * 1" # weekly, Monday 05:00 UTC

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: python/pyproject.toml

      - name: Install Tesseract with all language packs
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-all

      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e "./python[dev]"

      - name: Run benchmark
        run: |
          python benchmarks/run_benchmark.py \
            --languages "${{ github.event.inputs.languages || 'en,ta,ar,hi,he' }}" \
            --degradations all \
            --samples-per-language "${{ github.event.inputs.samples_per_language || '5' }}" \
            --seed-base 20000

      - name: Upload benchmark summary
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-summary
          path: benchmarks/latest_summary.json
